name: Build rootfs

# 在线构建可刷写的 rootfs.img 与 boot.img。
#
# 构建在 Arch Linux ARM 容器里完成：GitHub 的 arm64 runner 是原生 aarch64，
# 把官方 ALARM rootfs 用 docker import 成镜像后即可直接运行 pacman/makepkg，
# 不需要 chroot 套 devtools 的 clean chroot（那层嵌套在 CI 上问题很多）。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: '运行构建的 runner 标签（必须是 aarch64 Linux，且带 Docker）'
        type: string
        default: 'ubuntu-24.04-arm'
      desktop:
        description: '桌面环境'
        type: choice
        options:
          - none
          - kde
          - gnome
          - denial
        default: none
      denial_profile:
        description: 'Denial shell profile（仅 desktop=denial）'
        type: choice
        options:
          - desktop
          - mobile
        default: desktop
      filesystem:
        description: 'rootfs 文件系统（btrfs 默认启用 zstd 压缩与 noatime）'
        type: choice
        options:
          - ext4
          - btrfs
        default: ext4
      rootfs_size:
        description: 'rootfs 镜像大小（MiB）'
        type: string
        default: '4096'
      partlabel:
        description: '内核 root=PARTLABEL= 值'
        type: string
        default: 'linux'
      username:
        description: '普通用户名（默认 theresa；留空则沿用 mkrootfs.sh 的默认值）'
        type: string
        default: 'theresa'
      hostname:
        description: '主机名'
        type: string
        default: 'sheng'
      extra_packages:
        description: '额外 pacman 包（空格分隔，留空为无）'
        type: string
        default: ''
      retention_days:
        description: '构建产物保留天数'
        type: string
        default: '14'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: rootfs (${{ inputs.desktop }}, ${{ inputs.filesystem }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      DESKTOP: ${{ inputs.desktop }}
      DENIAL_PROFILE: ${{ inputs.denial_profile }}
      FILESYSTEM: ${{ inputs.filesystem }}
      IMAGE_SIZE_MB: ${{ inputs.rootfs_size }}
      PARTLABEL: ${{ inputs.partlabel }}
      ROOTFS_USER: ${{ inputs.username }}
      HOSTNAME_INPUT: ${{ inputs.hostname }}
      EXTRA_PACKAGES: ${{ inputs.extra_packages }}

    steps:
      - uses: actions/checkout@v4

      - name: Install host tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl zstd
          df -h / /tmp
          uname -m
          docker version --format '{{.Server.Version}}'

      - name: Import Arch Linux ARM container image
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/alarm.tar.gz \
            https://archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          docker import /tmp/alarm.tar.gz alarm-build:latest
          rm -f /tmp/alarm.tar.gz
          docker run --rm alarm-build:latest /bin/bash -c \
            'uname -m; head -1 /etc/os-release; pacman -V | head -1'

      - name: Render build script
        run: |
          cat > "$RUNNER_TEMP/ci-build.sh" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          cd /work

          echo "== 环境"
          uname -m
          head -2 /etc/os-release

          echo "== 初始化 pacman keyring"
          pacman-key --init
          pacman-key --populate archlinuxarm || true

          # ALARM 镜像的 db 与文件偶尔不同步（典型表现是某个包 404）；每次安装前
          # 重新同步 db 并重试，同时关闭低速中断。用 -Syu 做完整升级，避免只升级
          # systemd 时与镜像里旧版 systemd-sysvcompat/resolvconf 冲突。
          install_retry() {
            local -a pkgs=("$@")
            local attempt
            for attempt in 1 2 3; do
              if pacman -Syu --needed --noconfirm --disable-download-timeout \
                "${pkgs[@]}"; then
                return 0
              fi
              echo "!! 安装失败，第 ${attempt} 次重试"
              sleep 10
            done
            return 1
          }

          echo "== 安装基础构建工具"
          install_retry base-devel git sudo curl zstd e2fsprogs btrfs-progs \
            arch-install-scripts ripgrep

          id -u builder >/dev/null 2>&1 || useradd -m -s /bin/bash builder
          chown -R builder:builder /work

          echo "== make check"
          su -s /bin/bash builder -c 'cd /work && make check'

          echo "== 汇总 PKGBUILD 依赖"
          su -s /bin/bash builder -c '
            for dir in /work/pkgs/*/; do
              ( cd "$dir" && makepkg --printsrcinfo )
            done
          ' > /tmp/srcinfo

          mapfile -t build_deps < <(
            awk -F' = ' '/depends/ { print $2 }' /tmp/srcinfo |
              sed 's/[<>=].*//' | sort -u
          )

          # 内部包（libssc、iio-sensor-proxy 等）不在官方仓库里，混进同一个
          # 事务会让整批安装失败，先筛掉不可用的名字。
          pacman -Sy --noconfirm --disable-download-timeout >/dev/null 2>&1 || true
          available_deps=()
          for dep in "${build_deps[@]}"; do
            [[ -n "$dep" ]] || continue
            pacman -Si "$dep" >/dev/null 2>&1 && available_deps+=("$dep")
          done

          if ((${#available_deps[@]} > 0)); then
            echo "== 预装 ${#available_deps[@]} 个仓库依赖"
            install_retry "${available_deps[@]}" || echo "WARN: 部分依赖未能安装，继续"
          fi

          echo "== 按阶段构建"
          # shellcheck source=scripts/lib/packages.sh
          source /work/scripts/lib/packages.sh
          mkdir -p /work/out/pkgs

          # 带本地文件的包（hexagonrpc、sensors、rfsa 等）在构建前需要
          # 生成确定性的 files.tar.gz，build-pkgs.sh 平时会做，这里要自己来。
          echo "== 生成本地 files.tar.gz"
          su -s /bin/bash builder -c 'cd /work && bash scripts/package-files.sh'

          install_built() {
            local name file
            for name in "$@"; do
              file="$(find /work/out/pkgs -maxdepth 1 -name "${name}-*.pkg.tar.*" -print -quit)"
              [[ -n "$file" ]] || { echo "WARN: 找不到 $name 的构建产物"; continue; }
              pacman -U --noconfirm "$file"
            done
          }

          for stage in "${BUILD_STAGES[@]}"; do
            echo "== 阶段 $stage: ${PACKAGES_BY_STAGE[$stage]}"
            for name in ${PACKAGES_BY_STAGE[$stage]}; do
              echo "== 构建 $name"
              su -s /bin/bash builder -c \
                "cd /work/pkgs/$name && makepkg -f --nodeps --noconfirm"
              find "/work/pkgs/$name" -maxdepth 1 -name '*.pkg.tar.*' \
                -exec mv -t /work/out/pkgs {} +
            done
            # 内部依赖包装进容器，供后续阶段使用
            case "$stage" in
              0) install_built hexagonrpc libksysguard libssc ;;
              1) install_built iio-sensor-proxy ;;
            esac
          done

          echo "== 生成本地仓库"
          bash /work/scripts/build-repo.sh

          echo "== 组装 rootfs"
          rootfs_args=(
            --desktop "${DESKTOP:-none}"
            --fs "${FILESYSTEM:-ext4}"
            --size "${IMAGE_SIZE_MB:-4096}"
            --partlabel "${PARTLABEL:-linux}"
          )
          [[ -z "${HOSTNAME_INPUT:-}" ]] || rootfs_args+=(--hostname "$HOSTNAME_INPUT")
          [[ -z "${ROOTFS_USER:-}" ]] || rootfs_args+=(--user "$ROOTFS_USER")
          [[ -z "${EXTRA_PACKAGES:-}" ]] || rootfs_args+=(--extra "$EXTRA_PACKAGES")

          [[ -n "${ROOTFS_PASSWORD:-}" ]] || export ROOTFS_PASSWORD=password
          if [[ "${DESKTOP:-none}" == denial ]]; then
            export ROOTFS_DENIAL_PROFILE="${DENIAL_PROFILE:-desktop}"
          fi

          bash /work/scripts/mkrootfs.sh "${rootfs_args[@]}"
          SCRIPT
          chmod +x "$RUNNER_TEMP/ci-build.sh"

      - name: Build packages, repository and images
        env:
          ROOTFS_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}
        run: |
          if [[ -z "${ROOTFS_PASSWORD:-}" ]]; then
            export ROOTFS_PASSWORD=password
          else
            echo "::add-mask::$ROOTFS_PASSWORD"
          fi
          docker run --rm --privileged \
            --volume "$PWD:/work" \
            --volume "$RUNNER_TEMP/ci-build.sh:/ci-build.sh:ro" \
            --env DESKTOP="$DESKTOP" \
            --env DENIAL_PROFILE="$DENIAL_PROFILE" \
            --env FILESYSTEM="$FILESYSTEM" \
            --env IMAGE_SIZE_MB="$IMAGE_SIZE_MB" \
            --env PARTLABEL="$PARTLABEL" \
            --env ROOTFS_USER="$ROOTFS_USER" \
            --env HOSTNAME_INPUT="$HOSTNAME_INPUT" \
            --env EXTRA_PACKAGES="$EXTRA_PACKAGES" \
            --env ROOTFS_PASSWORD="$ROOTFS_PASSWORD" \
            alarm-build:latest /bin/bash /ci-build.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          sudo cp "$PWD/out/rootfs/boot.img" dist/
          sudo zstd -T0 -3 -q -f "$PWD/out/rootfs/rootfs.img" -o dist/rootfs.img.zst
          sudo chown -R "$(id -u):$(id -g)" dist
          (cd dist && sha256sum boot.img rootfs.img.zst > SHA256SUMS)
          ls -lh dist
          {
            echo "### rootfs ($DESKTOP, $FILESYSTEM)"
            echo ""
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rootfs
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-${{ inputs.filesystem }}-${{ inputs.desktop }}-${{ inputs.rootfs_size }}m
          path: dist/rootfs.img.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

      - name: Upload boot image
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ inputs.filesystem }}-${{ inputs.desktop }}-${{ inputs.rootfs_size }}m
          path: |
            dist/boot.img
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}
